name: terraform

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_VERSION: 0.76.1

jobs:
  static-checks:
    name: fmt · validate · tflint · trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform validate (every root and module)
        run: |
          for dir in envs/dev modules/network modules/web; do
            echo "::group::$dir"
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
            echo "::endgroup::"
          done
      - uses: terraform-linters/setup-tflint@v4
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}   # avoids API rate limits when downloading the AWS ruleset
        run: |
          tflint --init
          tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
      - name: Install Trivy
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -sSfLO "$base/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "$base/trivy_${TRIVY_VERSION}_checksums.txt" | grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" | sha256sum -c -
          tar xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
      - name: Trivy IaC misconfiguration scan
        run: ./trivy config --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore .

  plan:
    name: terraform plan (when AWS credentials are configured)
    needs: static-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
        if: env.AWS_ROLE_ARN != ''
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ROLE_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-3
      - uses: hashicorp/setup-terraform@v3
        if: env.AWS_ROLE_ARN != ''
      - name: plan
        if: env.AWS_ROLE_ARN != ''
        run: |
          terraform -chdir=envs/dev init -backend=false -input=false
          terraform -chdir=envs/dev plan -input=false -no-color
      - name: skipped
        if: env.AWS_ROLE_ARN == ''
        run: echo "No AWS_ROLE_ARN repository variable set; plan skipped (no long-lived AWS keys are stored in this repo)."
